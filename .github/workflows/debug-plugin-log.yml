name: debug-plugin-log

# Temporary: finds out why the plugin log settings suite takes the runner down.
on:
  push:
    branches:
      - 'debug/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sample the stack of the runaway suite
        run: |
          set +e
          cat > /tmp/watchdog.cjs <<'WATCHDOG'
          // Samples the main thread's JavaScript stack from a worker, through the
          // inspector, once the process has been running for WATCHDOG_AFTER_MS.
          const { Worker, isMainThread } = require('node:worker_threads');
          if (isMainThread && process.env.WATCHDOG_AFTER_MS) {
            const worker = new Worker(`
              const inspector = require('node:inspector');
              const fs = require('node:fs');
              const { workerData } = require('node:worker_threads');
              let samples = 0;
              const scripts = new Map();
              setTimeout(() => {
                const session = new inspector.Session();
                session.connectToMainThread();
                session.on('Debugger.scriptParsed', ({ params }) => { scripts.set(params.scriptId, params.url); });
                session.on('Debugger.paused', ({ params }) => {
                  samples += 1;
                  const frames = params.callFrames.slice(0, workerData.depth).map((f) =>
                    '  ' + (f.functionName || '<anonymous>') + '  ' + String(f.url || scripts.get(f.location.scriptId) || '').split('/').slice(-4).join('/') + ':' + (f.location.lineNumber + 1) + ':' + (f.location.columnNumber + 1));
                  const top = params.callFrames[0];
                  const finish = (memory) => {
                    fs.writeSync(2, 'WATCHDOG sample ' + samples + ' frames=' + params.callFrames.length + ' mem=' + memory + '\\n' + frames.join('\\n') + '\\n');
                    session.post('Debugger.resume');
                  };
                  if (!top) return finish('?');
                  session.post('Debugger.evaluateOnCallFrame', {
                    callFrameId: top.callFrameId,
                    expression: 'JSON.stringify(process.memoryUsage())',
                    returnByValue: true,
                  }, (error, result) => finish(error ? String(error) : String(result && result.result && result.result.value)));
                });
                session.post('Debugger.enable', () => session.post('Debugger.pause'));
                setInterval(() => { if (samples < workerData.max) session.post('Debugger.pause'); }, workerData.every);
              }, workerData.after);
            `, {
              eval: true,
              workerData: {
                after: Number(process.env.WATCHDOG_AFTER_MS),
                every: Number(process.env.WATCHDOG_EVERY_MS || 1500),
                max: Number(process.env.WATCHDOG_MAX || 6),
                depth: Number(process.env.WATCHDOG_DEPTH || 45),
              },
            });
            worker.unref();
          }
          WATCHDOG
          CAP="sudo systemd-run --quiet --scope --uid=$(id -u) --gid=$(id -g) -p MemoryMax=3G -p MemorySwapMax=0"
          hung=0
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== run $i"
            $CAP env PATH="$PATH" HOME="$HOME" WATCHDOG_AFTER_MS=5000 WATCHDOG_EVERY_MS=1200 WATCHDOG_MAX=4 WATCHDOG_DEPTH=70 \
              timeout -s KILL 40 node --require /tmp/watchdog.cjs --import tsx components/settings/tabs/PluginLogSettings.test.tsx > /tmp/run-$i.log 2>&1
            code=$?
            echo "run $i exit=$code"
            if [ "$code" != "0" ]; then
              hung=$((hung + 1))
              head -c 30000 /tmp/run-$i.log
              echo
            else
              grep -c "^ok" /tmp/run-$i.log
            fi
            if [ "$hung" -ge 2 ]; then break; fi
          done
          echo "hung runs: $hung"
          true
