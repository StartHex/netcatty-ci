name: debug-plugin-log

# Temporary: checks the memory cap wrapper and two test fixes on a runner.
on:
  push:
    branches:
      - 'debug/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wrapper changes nothing but the cgroup
        env:
          PROBE_VALUE: "carried over, with spaces and \"quotes\""
        run: |
          set +e
          probe='ulimit -a | tr "\n" ";"; echo; id; umask; echo "probe=$PROBE_VALUE"; docker ps --format "{{.ID}}" >/dev/null 2>&1 && echo docker-ok || echo docker-denied; cat /proc/self/cgroup'
          bash -c "$probe" > /tmp/plain.txt 2>&1
          bash scripts/ci/with-memory-cap.sh bash -c "$probe" > /tmp/wrapped.txt 2>&1
          echo "=== plain"; cat /tmp/plain.txt | cut -c1-400
          echo "=== wrapped"; cat /tmp/wrapped.txt | cut -c1-400
          echo "=== difference (expected: only the cgroup line)"
          diff /tmp/plain.txt /tmp/wrapped.txt
          env | sort | grep -v "^_=" > /tmp/env-plain.txt
          bash scripts/ci/with-memory-cap.sh env | sort | grep -v "^_=" > /tmp/env-wrapped.txt
          echo "=== environment difference (expected: none)"
          diff <(cut -d= -f1 /tmp/env-plain.txt) <(cut -d= -f1 /tmp/env-wrapped.txt) && echo "same variable names"
          cmp /tmp/env-plain.txt /tmp/env-wrapped.txt && echo "same values"
          echo "=== exit status and signals"
          bash scripts/ci/with-memory-cap.sh sh -c 'exit 7'; echo "exit=$? (expected 7)"
          true
      - name: The real steps under the cap
        run: |
          set +e
          npm run check:plugin-contract > /tmp/contract.log 2>&1; echo "contract exit=$?"
          bash scripts/ci/with-memory-cap.sh node --test --import tsx components/settings/tabs/Plugin*.test.tsx > /tmp/all.log 2>&1
          echo "plugin suites exit=$?"
          grep "^not ok\|^# \(tests\|pass\|fail\|cancelled\|duration_ms\)" /tmp/all.log
          true
