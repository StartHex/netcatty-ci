name: debug-plugin-log

# Temporary: finds out why the plugin log settings suite takes the runner down.
on:
  push:
    branches:
      - 'debug/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe the suite under a memory cap
        run: |
          set +e
          echo "cpus=$(nproc)"; free -m; node -v; systemctl --version | head -1
          mkdir -p /tmp/reports
          monitor() {
            while true; do
              echo "--- $(date +%T) $(free -m | awk 'NR==2{print "used="$3" free="$4" avail="$7}') procs=$(ps -e --no-headers | wc -l)"
              ps -eo pid,ppid,rss,pcpu,nlwp,etime,args --sort=-rss | sed -n 2,5p | cut -c1-170
              sleep 2
            done
          }
          # Pick a way to cap memory so a runaway process dies alone.
          CAP=""
          if sudo systemd-run --quiet --scope --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=3G -p MemorySwapMax=0 true; then
            CAP="sudo systemd-run --quiet --scope --uid=$(id -u) --gid=$(id -g) -p MemoryMax=3G -p MemorySwapMax=0"
          fi
          echo "cap command: ${CAP:-<none>}"
          monitor &
          MON=$!
          report() {
            for p in $(pgrep -x node); do
              if tr '\0' ' ' < /proc/$p/cmdline | grep -q "$1"; then
                echo "requesting a report from node pid $p: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-160)"
                kill -USR2 "$p"
              fi
            done
            sleep 4
            for f in /tmp/reports/*.json; do
              [ -f "$f" ] || continue
              node -e '
                const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                console.log("REPORT", process.argv[1], "trigger=", r.header && r.header.trigger);
                console.log("js stack:", JSON.stringify(r.javascriptStack, null, 1).slice(0, 6000));
                console.log("heap:", JSON.stringify(r.javascriptHeap && { total: r.javascriptHeap.totalMemory, used: r.javascriptHeap.usedMemory, external: r.javascriptHeap.externalMemory }));
                console.log("rss:", r.resourceUsage && r.resourceUsage.rss, "handles:", (r.libuv || []).length);
                const kinds = {}; for (const h of r.libuv || []) kinds[h.type] = (kinds[h.type] || 0) + 1; console.log("libuv:", JSON.stringify(kinds));
              ' "$f"
              mv "$f" "$f.done"
            done
          }
          export NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/reports"
          for i in 1 2 3 4; do
            echo "=== single file, run $i"
            $CAP env PATH="$PATH" HOME="$HOME" NODE_OPTIONS="$NODE_OPTIONS" \
              timeout -s KILL 60 node --import tsx components/settings/tabs/PluginLogSettings.test.tsx > /tmp/run-$i.log 2>&1 &
            PID=$!
            for s in $(seq 1 12); do sleep 1; kill -0 $PID 2>/dev/null || break; done
            if kill -0 $PID 2>/dev/null; then
              echo "run $i still running after 12s"
              report PluginLogSettings
            fi
            wait $PID; echo "run $i exit=$?"
            tail -25 /tmp/run-$i.log | cut -c1-300
          done
          echo "=== all plugin settings suites, one file at a time"
          $CAP env PATH="$PATH" HOME="$HOME" NODE_OPTIONS="$NODE_OPTIONS" \
            timeout -s KILL 240 node --test --test-concurrency=1 --import tsx components/settings/tabs/Plugin*.test.tsx > /tmp/run-all.log 2>&1 &
          PID=$!
          LAST=0
          for s in $(seq 1 110); do
            sleep 2; kill -0 $PID 2>/dev/null || break
            SIZE=$(stat -c %s /tmp/run-all.log)
            if [ "$SIZE" = "$LAST" ] && [ $((s % 6)) -eq 0 ]; then
              echo "no output for a while (log at $SIZE bytes)"; grep "^# Subtest\|^ok\|^not ok" /tmp/run-all.log | tail -3
              report "components/settings/tabs/Plugin"
            fi
            LAST=$SIZE
          done
          wait $PID; echo "all suites exit=$?"
          grep -c "^ok" /tmp/run-all.log; grep "^not ok\|^# \(tests\|pass\|fail\|cancelled\)" /tmp/run-all.log | tail -12
          tail -40 /tmp/run-all.log | cut -c1-300
          kill $MON
          echo "=== kernel log"
          sudo dmesg | grep -i -E "oom|killed process|out of memory" | tail -20
          true
